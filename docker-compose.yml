services:
  redis:
    image: redis:7-alpine
    container_name: routedecoder-redis
    ports:
      - "6379:6379"

  app1:
    build: .
    container_name: routedecoder-app1
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - redis

  app2:
    build: .
    container_name: routedecoder-app2
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: routedecoder-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
